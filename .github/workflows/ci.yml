name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        description: The version part a manual release of main increments
        type: choice
        options: [patch, minor, major]
        default: patch

# A newer commit of a pull request supersedes the run of the older one. Every run of main is its own group: none
# waits for or cancels another, and a release in flight finishes.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BALAMUT_TEST_PG_HOST: 127.0.0.1
  BALAMUT_TEST_PG_PORT: "5432"
  BALAMUT_TEST_PG_USER: balamut
  BALAMUT_TEST_PG_PASSWORD: balamut

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: balamut
          POSTGRES_PASSWORD: balamut
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U balamut"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Sync
        run: uv sync --all-extras
      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Type check
        run: uv run pyright
      - name: Test
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          uv run pytest -q

  # balamut gates its own change with its own suite: the mutants of the lines a pull request changes, or of the
  # lines main gained since the latest release. A fork has no release tags to measure main against, so there
  # only pull requests are gated.
  dogfood:
    if: github.event_name == 'pull_request' || !github.event.repository.fork
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: balamut
          POSTGRES_PASSWORD: balamut
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U balamut"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Sync
        run: uv sync --all-extras
      # The verdict cache is addressed by content: a restored one leaves only the mutants whose code or covering
      # tests changed. It is saved after a failed gate too, so the run that follows a fix starts warm.
      - name: Restore the verdict cache
        uses: actions/cache/restore@v6
        with:
          path: .balamut/cache
          key: balamut-verdicts-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: balamut-verdicts-
      - name: Mutation gate
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          mkdir -p "$RUNNER_TEMP/dogfood"
          uv run balamut diff \
            --base "${BASE:-$(git describe --tags --abbrev=0)}" \
            --cache .balamut/cache/ci.sqlite \
            --report-json "$RUNNER_TEMP/dogfood/report.json" \
            --html "$RUNNER_TEMP/dogfood/report.html"
      - name: Save the verdict cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .balamut/cache
          key: balamut-verdicts-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dogfood-report
          path: ${{ runner.temp }}/dogfood
          if-no-files-found: ignore

  # Every green commit of main that changes the installed package becomes a release: the next patch version as a
  # tag on that commit, the distributions on PyPI (trusted publishing through the `pypi` environment) and a GitHub
  # release. The version exists only as the tag; the build reads it from git. A manual run of the workflow on main
  # releases its head with the chosen increment.
  release:
    needs: [check, dogfood]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !github.event.repository.fork
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: release
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Decide the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          # Only the head of main is released: when main has moved on, the run of the newer commit releases it.
          git fetch --quiet origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "main has moved past $(git rev-parse --short HEAD): nothing to release here"
            exit 0
          fi
          # A tag already on this commit is a release interrupted half-way: finish it under the same version.
          version=$(git tag --points-at HEAD --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [ -z "$version" ]; then
            latest=$(git tag --merged HEAD --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
            if [ -z "$BUMP" ] && git diff --quiet "$latest" HEAD -- src pyproject.toml README.md LICENSE; then
              echo "the installed package is unchanged since $latest: nothing to release"
              exit 0
            fi
            IFS=. read -r major minor patch <<< "$latest"
            case "${BUMP:-patch}" in
              major) version="$((major + 1)).0.0" ;;
              minor) version="$major.$((minor + 1)).0" ;;
              patch) version="$major.$minor.$((patch + 1))" ;;
            esac
            git tag "$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build
        if: steps.version.outputs.version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv build
          test -f "dist/balamut-$VERSION-py3-none-any.whl"
          test -f "dist/balamut-$VERSION.tar.gz"
      - name: Publish
        if: steps.version.outputs.version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin "refs/tags/$VERSION"
          uv publish --check-url https://pypi.org/simple/
          gh release view "$VERSION" > /dev/null 2>&1 ||
            gh release create "$VERSION" --verify-tag --title "balamut $VERSION" --generate-notes
