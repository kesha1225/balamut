[project]
name = "balamut-precision-operator"
version = "0.1.0"
description = "Example third-party balamut operator kind: the precision of round()"
requires-python = ">=3.14"
dependencies = ["balamut>=0.1"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/balamut_precision"]
